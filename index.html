<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mobile Grammar</title>
  <meta name="description" content="130 lessons of English grammar with explanations in Russian. Web version of the Mobile Grammar Android app.">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="appbar">
    <button class="icon-button" id="nav-button" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="nav-icon" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <h1 class="appbar-title" id="title">Mobile Grammar</h1>
    <input class="search" id="search" type="search" autocomplete="off" hidden>
    <div class="appbar-actions" id="actions"></div>
  </header>

  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" aria-label="Menu" hidden>
    <div class="drawer-header">
      <img src="icons/icon-192.png" alt="" width="56" height="56">
      <span id="drawer-title">Mobile Grammar</span>
    </div>
    <ul class="drawer-list" id="drawer-list"></ul>
    <label class="drawer-language">
      <span id="language-label">Language</span>
      <select id="language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
      </select>
    </label>
  </nav>

  <main id="main" tabindex="-1"></main>

  <button class="fab" id="scroll-top" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l1.4 1.4L11 7.8V20h2V7.8l5.6 5.6L20 12l-8-8z"/></svg>
  </button>
  <div class="snackbar" id="snackbar" role="status" aria-live="polite" hidden></div>

  <dialog class="dialog" id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <div class="dialog-buttons">
        <button value="cancel" id="dialog-cancel" type="submit"></button>
        <button value="ok" id="dialog-ok" type="submit"></button>
      </div>
    </form>
  </dialog>

  <noscript><p class="empty">This site needs JavaScript.</p></noscript>
</body>
</html>
